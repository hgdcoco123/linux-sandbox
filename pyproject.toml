[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-sandbox"
version = "0.5.3"
description = "Isolated execution with verifiable failure explanations: a Linux sandbox and an evidence-analysis layer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hgdcoco123" }]
keywords = ["sandbox", "isolation", "cgroups", "llm", "evidence", "reproducibility"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
# The session/batch SDK speaks protobuf; the analysis layer does not need it.
sdk = ["protobuf>=3.20"]

[project.urls]
Documentation = "https://github.com/OWNER/linux-sandbox/blob/master/docs/QUICKSTART.md"

[project.scripts]
sandbox = "sandbox_ai.bin_entry:sandbox"
sbx = "sandbox_ai.bin_entry:sbx"
sandbox-ai = "sandbox_ai.cli:main"

[tool.setuptools]
# linux_sandbox_bin holds the static binaries; tools/build_wheel.sh stages them before building
# and removes them afterwards, so the source tree never carries build output.
packages = ["sandbox_ai", "sdk", "linux_sandbox_bin"]

[tool.setuptools.package-data]
linux_sandbox_bin = ["sandbox", "sandbox-launcher"]
