name: sandbox action smoke
# Exercises action.yml on a GitHub-hosted runner: the one thing the local VM could not cover
# (the checkout/inputs shell around the same delegation mechanism).
on: [push, pull_request, workflow_dispatch]

jobs:
  action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (json and spdlog are vendored, these are not)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev protobuf-compiler libprotobuf-dev

      - name: Which startup modes does this runner allow?
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build build --parallel 2 >/dev/null
          ./build/sandbox doctor | python3 -c \
            "import json,sys; p=json.load(sys.stdin)['isolation_probe']; print('isolation:', p.get('available'), p.get('stage'))"

      - name: Run the action
        id: run
        uses: ./
        with:
          command: /bin/echo sandbox-smoke
          timeout-ms: '3000'
          explain: 'false'
          # Hosted runners often do not delegate cpu/memory/pids to a user unit; this keeps the
          # action's own plumbing (report, outputs, fail-on) under test on any runner.
          allow-process: 'true'
        # Runners that restrict unprivileged user namespaces cannot isolate; the action says so
        # instead of pretending. Fail the step only when it did not even fall back.
        continue-on-error: false

      - name: Assert the verdict was reported
        run: |
          case "${{ steps.run.outputs.verdict }}" in
            ok|target_failed|harness_error|cleanup_incomplete) ;;
            *) echo "::error::no verdict was reported"; exit 1 ;;
          esac
          test -f sandbox-report.json
          python3 - <<'PY'
          import json
          report = json.load(open('sandbox-report.json'))
          assert report['schema_version'] == 2, report['schema_version']
          assert report['run_id'].startswith('run-'), report['run_id']
          # A diagnostic run has no workspace; an isolated one must carry the field.
          assert 'workspace' in report or report['isolated'] is False, sorted(report)
          print('report keys:', sorted(report)[:8])
          PY
