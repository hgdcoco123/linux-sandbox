name: Linux build and behavior checks
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # json and spdlog are vendored; libseccomp and protobuf are system development packages.
      # python3-protobuf is needed by the session wire tests, which import the generated pb2.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev protobuf-compiler libprotobuf-dev python3-protobuf
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - name: ctest
        run: |
          set +e
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            summary=$(grep -E '^[[:space:]]*[0-9]+ - ' ctest.log | head -3 | tr '\n' ' ')
            echo "::error title=ctest failed::${summary:-see the log}"
          fi
          exit "${status}"
      - name: Prepare static fixture runtime
        run: python3 tools/make_runtime.py --fixture build/sandbox-fixture --output /tmp/sandbox-test-runtime
      - name: Namespace and cgroup behavior checks in a delegated transient service
        # A runner that does not delegate cpu/memory/pids to a user unit cannot isolate; the
        # driver says so and skips rather than pretending.
        run: |
          set +e
          sudo systemd-run --wait --pipe --collect -p Delegate=yes -p Type=exec \
            /usr/bin/python3 "${GITHUB_WORKSPACE}/tools/delegated_run.py" \
            --sandbox "${GITHUB_WORKSPACE}/build/sandbox" --test-runtime /tmp/sandbox-test-runtime
          status=$?
          if [ "${status}" -ne 0 ]; then
            echo "::error title=delegated checks failed::exit ${status}; this runner may not allow unprivileged user namespaces or controller delegation"
          fi
          exit "${status}"
